name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Verify finalized dataset
        shell: bash
        run: test -f website/data/deployment-ready.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Verify static dataset is in the Pages artifact
        shell: bash
        run: |
        test -s website/dist/data/commute-summary.json
        test -s website/dist/data/methodology.json
        test -s website/dist/data/deployment-ready.json
        test -s website/dist/methodology.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
