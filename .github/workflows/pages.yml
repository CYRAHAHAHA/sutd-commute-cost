name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Verify finalized dataset
        shell: bash
        run: test -f website/data/deployment-ready.json
      - name: Decide whether dataset policy check is required
        id: policy-check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Manual deployment: dataset policy check required."
            exit 0
          fi

          while IFS= read -r changed_file; do
            case "$changed_file" in
              website/src/*|website/public/*|website/index.html|website/methodology.html|website/evidence.html|website/DESIGN.md|website/package.json|website/package-lock.json|.github/workflows/pages.yml)
                ;;
              *)
                echo "Dataset-affecting change detected: $changed_file"
                echo "required=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          echo "UI-only change detected; allowing deployment against the existing published dataset."
          echo "required=false" >> "$GITHUB_OUTPUT"
      - name: Verify published dataset matches project policy
        if: steps.policy-check.outputs.required == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config/project.json', 'utf8'));
          const methodology = JSON.parse(fs.readFileSync('website/data/methodology.json', 'utf8'));
          const configured = config.providers.ONEMAP.origin_grouping;
          const published = methodology.providers.ONEMAP.origin_grouping;
          if (config.dataset_version !== methodology.dataset_version) {
            throw new Error(`Dataset version mismatch: config=${config.dataset_version}, published=${methodology.dataset_version}`);
          }
          if (!published || configured.enabled !== published.enabled || configured.mode !== published.mode) {
            throw new Error('Published OneMap resolution policy does not match config/project.json');
          }
          NODE
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Verify static dataset is in the Pages artifact
        shell: bash
        run: |
          test -s website/dist/data/commute-summary.json
          test -s website/dist/data/methodology.json
          test -s website/dist/data/deployment-ready.json
          test -s website/dist/data/onemap-evidence.json
          test -s website/dist/methodology.html
          test -s website/dist/evidence.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
